<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Réservations</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Réservations</h1>
            <p id="resa-count">— réservations</p>
          </div>
          <div class="app-pagehead__actions">
            <!-- Filtre par logement — rempli et câblé par layout.js -->
            <select class="select app-logement-select" id="app-logement" aria-label="Filtrer par logement"></select>
            <button class="btn btn--secondary" id="resa-export">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              Exporter (CSV)
            </button>
            <button class="btn btn--primary" id="resa-new">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Nouvelle réservation
            </button>
          </div>
        </div>

        <div class="app-filters">
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="input" type="search" id="resa-search" placeholder="Voyageur, logement, réf…" />
          </div>
          <select class="select" id="resa-canal">
            <option value="all">Tous les canaux</option>
            <option value="airbnb">Airbnb</option>
            <option value="booking">Booking.com</option>
            <option value="direct">Direct</option>
          </select>
          <select class="select" id="resa-paiement">
            <option value="all">Tous les paiements</option>
            <option value="paye">Payé</option>
            <option value="acompte">Acompte</option>
            <option value="impaye">Impayé</option>
          </select>
          <select class="select" id="resa-statut">
            <option value="all">Tous les statuts</option>
            <option value="demande">Demandes à valider</option>
            <option value="confirme">Confirmées</option>
            <option value="en_cours">En cours</option>
            <option value="termine">Terminées</option>
            <option value="annule">Annulées</option>
          </select>
          <select class="select" id="resa-periode">
            <option value="all">Toute période</option>
            <option value="avenir">À venir</option>
            <option value="encours">En cours</option>
            <option value="passees">Passées</option>
            <option value="mois">Ce mois-ci</option>
          </select>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>Voyageur</th><th>Logement</th><th>Canal</th><th>Séjour</th>
              <th class="num">Nuits</th><th class="num">Montant</th><th>Paiement</th><th>Statut</th>
            </tr></thead>
            <tbody id="resa-tbody"><!-- injecté --></tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ia-redaction.js"></script>
  <script src="../js/datepicker.js"></script>
  <script src="../js/resa-form.js"></script>
  <script src="../js/reservations.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
