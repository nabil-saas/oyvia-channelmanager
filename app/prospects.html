<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Mes prospects</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/marketplace.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Mes prospects</h1>
            <p>Les demandes de gestion que vous avez envoyées, et où elles en sont.</p>
          </div>
          <div class="app-pagehead__actions">
            <a class="btn btn--primary" href="marketplace.html">Parcourir la marketplace</a>
          </div>
        </div>

        <div class="mp-pipeline" id="mp-pipeline"><!-- injecté : compteurs par étape --></div>

        <div class="card card--pad">
          <div class="mp-filtres">
            <select class="select" id="mp-f-statut" aria-label="Filtrer par statut"></select>
            <span class="mp-compteur" id="mp-p-compteur"></span>
          </div>
          <div id="mp-prospects"><!-- injecté --></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Panneau : suivi d'une demande -->
  <aside class="panel panel--lg" id="mp-panel" role="dialog" aria-modal="true" aria-labelledby="mp-panel-titre">
    <div class="panel__head">
      <div class="grow"><h3 class="modal__title" id="mp-panel-titre">Suivi</h3></div>
      <button class="icon-btn" onclick="UI.closeAll()" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="panel__body" id="mp-panel-corps"><!-- injecté --></div>
    <div class="panel__foot" id="mp-panel-pied"><!-- injecté --></div>
  </aside>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ia-redaction.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/mp-prospects.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
