<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Fiches de police</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Fiches de police</h1>
            <p>Déclaration obligatoire des voyageurs étrangers, à conserver six mois et à tenir à disposition des autorités.</p>
          </div>
          <div class="app-pagehead__actions">
            <select class="select app-logement-select" id="fp-filtre" aria-label="Filtrer par statut"></select>
          </div>
        </div>

        <div id="fp-urgences"><!-- injecté : échéances sous 24 h --></div>

        <div class="card card--pad">
          <p class="eyebrow mb-4">Toutes les fiches</p>
          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Voyageur</th><th>Logement</th><th>Séjour</th>
                <th>Nationalité</th><th>Pièces</th><th>Statut</th><th></th>
              </tr></thead>
              <tbody id="fp-tbody"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modale : consultation, puis édition au clic sur le stylo -->
  <div class="modal modal--lg" id="fp-modal" role="dialog" aria-modal="true" aria-labelledby="fp-modal-title">
    <div class="modal__head">
      <h3 class="modal__title" id="fp-modal-title">Fiche de police</h3>
      <div class="row gap-2">
        <button class="icon-btn" id="fp-edit" title="Modifier la fiche" aria-label="Modifier la fiche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn" onclick="UI.closeAll()" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
    <div class="modal__body" id="fp-corps"><!-- injecté : lecture ou édition --></div>
    <div class="modal__foot" id="fp-pied"><!-- injecté --></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/police.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
