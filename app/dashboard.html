<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Tableau de bord</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1 id="dash-hello">Bonjour Camille</h1>
            <p id="dash-date">Voici l'activité de vos logements aujourd'hui.</p>
          </div>
          <div class="app-pagehead__actions">
            <!-- Filtre par logement — rempli et câblé par layout.js -->
            <select class="select app-logement-select" id="app-logement" aria-label="Filtrer par logement"></select>
            <a class="btn btn--secondary" href="calendrier.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              Voir le calendrier
            </a>
            <a class="btn btn--primary" href="reservations.html?new=1">Nouvelle réservation</a>
          </div>
        </div>

        <!-- KPIs -->
        <div class="app-grid app-grid--kpi" id="dash-kpi"><!-- injecté --></div>

        <!-- Graphique + activité du jour -->
        <div class="app-grid app-grid--2-1" style="margin-top:var(--sp-4);">
          <div class="card">
            <div class="card__head">
              <span class="card__title">Taux d'occupation</span>
              <span class="badge badge--neutral" id="dash-occ-scope">6 derniers mois</span>
            </div>
            <div class="card__body">
              <div class="dash-chart"><canvas id="dash-occ"></canvas></div>
            </div>
          </div>
          <div class="card">
            <div class="card__head"><span class="card__title">Aujourd'hui</span></div>
            <div class="card__body" id="dash-today"><!-- injecté --></div>
          </div>
        </div>

        <!-- Prochaines réservations -->
        <div class="card" style="margin-top:var(--sp-4);">
          <div class="card__head">
            <span class="card__title">Prochaines réservations</span>
            <a class="btn btn--ghost btn--sm" href="reservations.html">Tout voir →</a>
          </div>
          <div class="table-wrap" style="border:0;border-radius:0;box-shadow:none;">
            <table class="table">
              <thead><tr><th>Voyageur</th><th>Logement</th><th>Canal</th><th>Arrivée</th><th class="num">Nuits</th><th class="num">Montant</th><th>Paiement</th></tr></thead>
              <tbody id="dash-next"><!-- injecté --></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
