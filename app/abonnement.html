<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Abonnement &amp; Facturation</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Abonnement &amp; Facturation</h1>
            <p>Vos logements réservés, vos options et votre facturation.</p>
          </div>
        </div>

        <div class="app-grid app-grid--2-1">
          <!-- Mois en cours -->
          <div class="ab-hero" id="ab-hero"><!-- injecté --></div>

          <!-- Récapitulatif de facturation -->
          <div class="card card--pad" style="align-self:start">
            <p class="eyebrow mb-4">Facturation</p>
            <div id="ab-summary"><!-- injecté --></div>
            <button class="btn btn--primary btn--block" style="margin-top:var(--sp-5)" onclick="UI.toast('Facture PDF téléchargée')">Télécharger la dernière facture</button>
            <a class="btn btn--secondary btn--block" style="margin-top:var(--sp-2)" href="../index.html#tarifs">Voir les tranches tarifaires</a>
          </div>
        </div>

        <!-- Historique de facturation -->
        <div class="card card--pad mt-4">
          <p class="eyebrow mb-4">Historique de facturation</p>
          <div id="ab-historique"><!-- injecté --></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/abonnement.js"></script>
</body>
</html>
