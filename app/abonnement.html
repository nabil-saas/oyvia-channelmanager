<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Abonnement &amp; Facturation</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Abonnement &amp; Facturation</h1>
            <p>Votre offre, vos logements gérés et votre facturation.</p>
          </div>
        </div>

        <div class="app-grid app-grid--2-1">
          <!-- Mois en cours -->
          <div class="ab-hero" id="ab-hero"><!-- injecté --></div>

          <!-- Récapitulatif de facturation -->
          <div class="card card--pad" style="align-self:start">
            <p class="eyebrow mb-4">Facturation</p>
            <div id="ab-summary"><!-- injecté --></div>
            <button class="btn btn--primary btn--block" style="margin-top:var(--sp-5)" onclick="UI.toast('Facture PDF téléchargée')">Télécharger la dernière facture</button>
            <a class="btn btn--secondary btn--block" style="margin-top:var(--sp-2)" href="../index.html#tarifs">Comparer les offres publiques</a>
          </div>
        </div>

        <!-- Changer d'offre : uniquement le contact du support. La grille des
             offres a été retirée — l'offre en cours est rappelée en tête de
             page, et le comparatif complet vit sur la landing. -->
        <div id="ab-support" class="mt-4"><!-- injecté --></div>

        <!-- Historique de facturation -->
        <div class="card card--pad mt-4">
          <p class="eyebrow mb-4">Historique de facturation</p>
          <div id="ab-historique"><!-- injecté --></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modale : demande de changement d'offre -->
  <div class="modal" id="ab-form-modal" role="dialog" aria-modal="true" aria-labelledby="ab-form-title">
    <div class="modal__head">
      <h3 class="modal__title" id="ab-form-title">Demander un changement d'offre</h3>
      <button class="icon-btn" onclick="UI.closeAll()" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal__body">
      <p class="text-sm text-soft mb-4">Votre offre actuelle : <b id="ab-f-offre-actuelle">—</b>. Rien n'est modifié à l'envoi : notre équipe vous recontacte pour valider avec vous.</p>
      <div class="app-grid app-grid--2">
        <div class="field"><label class="field__label" for="ab-f-offre">Offre souhaitée</label>
          <select class="select" id="ab-f-offre"></select></div>
        <div class="field"><label class="field__label" for="ab-f-parc">Logements à gérer</label>
          <input class="input" type="number" min="1" id="ab-f-parc" /></div>
      </div>
      <div class="field mt-4"><label class="field__label" for="ab-f-msg">Votre message</label>
        <textarea class="textarea" id="ab-f-msg" rows="4" placeholder="Échéance souhaitée, contraintes particulières, questions sur la facturation…"></textarea></div>
    </div>
    <div class="modal__foot">
      <button class="btn btn--secondary" onclick="UI.closeAll()">Annuler</button>
      <button class="btn btn--primary" id="ab-form-send">Envoyer la demande</button>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/layout.js"></script>
  <!-- Chargé ici pour que la demande envoyée au support arrive réellement
       dans le back-office, au lieu de disparaître dans un toast. -->
  <script src="../js/admin-data.js"></script>
  <script src="../js/abonnement.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
