<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Gestion des tâches</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Gestion des tâches</h1>
            <p>Le planning des interventions, généré à partir de vos départs.</p>
          </div>
          <div class="app-pagehead__actions">
            <a class="btn btn--ghost" href="../prestataire.html">Espace prestataire ↗</a>
            <a class="btn btn--secondary" href="equipe.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Gérer l'équipe
            </a>
            <button class="btn btn--primary" id="mn-add">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              Ajouter une tâche
            </button>
          </div>
        </div>

        <!-- Filtres -->
        <div class="app-filters">
          <select class="select" id="mn-prestataire"><option value="all">Tous les prestataires</option></select>
          <select class="select" id="mn-type">
            <option value="all">Tous les types</option>
            <option value="menage">Ménage</option>
            <option value="checkin">Check-in</option>
            <option value="maintenance">Maintenance</option>
            <option value="linge">Linge</option>
          </select>
          <select class="select" id="mn-statut">
            <option value="all">Tous les statuts</option>
            <option value="a_faire">À faire</option>
            <option value="en_cours">En cours</option>
            <option value="termine">Terminé</option>
          </select>
        </div>

        <!-- Planning -->
        <div id="mn-planning"><!-- injecté --></div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ia-redaction.js"></script>
  <script src="../js/datepicker.js"></script>
  <script src="../js/tache-form.js"></script>
  <script src="../js/menage.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
