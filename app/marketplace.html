<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/marketplace.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Marketplace</h1>
            <p>Les biens que des propriétaires cherchent à confier. Votre demande de gestion part avec un rapport de vos résultats, généré automatiquement.</p>
          </div>
          <div class="app-pagehead__actions">
            <a class="btn btn--secondary" href="prospects.html">Mes prospects</a>
          </div>
        </div>

        <div class="card card--pad">
          <div class="mp-filtres mb-4">
            <input class="input" type="search" id="mp-q" placeholder="Ville, quartier…" aria-label="Rechercher un bien" />
            <select class="select" id="mp-ville" aria-label="Filtrer par ville"></select>
            <select class="select" id="mp-type" aria-label="Filtrer par type de bien"></select>
            <select class="select" id="mp-statut" aria-label="Filtrer par disponibilité">
              <option value="tous">Tous les biens</option>
              <option value="disponible">Disponibles</option>
              <option value="recent">Publiés récemment</option>
              <option value="postule">Mes demandes</option>
            </select>
            <span class="mp-compteur" id="mp-compteur"></span>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead><tr>
                <th>Localisation</th><th>Type de bien</th><th>Publié</th><th>Statut</th><th></th>
              </tr></thead>
              <tbody id="mp-tbody"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modale : rapport de candidature, généré et non rédigé -->
  <div class="modal modal--lg" id="mp-modal" role="dialog" aria-modal="true" aria-labelledby="mp-modal-titre">
    <div class="modal__head">
      <h3 class="modal__title" id="mp-modal-titre">Demande de gestion</h3>
      <button class="icon-btn" onclick="UI.closeAll()" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal__body" id="mp-modal-corps"><!-- injecté --></div>
    <div class="modal__foot">
      <button class="btn btn--secondary" onclick="UI.closeAll()">Annuler</button>
      <button class="btn btn--primary" id="mp-envoyer">Envoyer ma demande</button>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/ia-redaction.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/mp-marketplace.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
