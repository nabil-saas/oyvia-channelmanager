<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia — Paramètres</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/vivi.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Paramètres</h1>
            <p>Gérez votre profil, votre sécurité et vos connexions aux plateformes.</p>
          </div>
        </div>

        <div class="tabs" id="pf-tabs">
          <button type="button" class="is-active" data-tab="profil">Profil</button>
          <button type="button" data-tab="localisation">Localisation</button>
          <button type="button" data-tab="sejour">Séjour</button>
          <button type="button" data-tab="conformite">Conformité</button>
          <button type="button" data-tab="roles">Rôles &amp; accès</button>
          <button type="button" data-tab="plateformes">Plateformes</button>
        </div>

        <div class="tabpane is-active" data-pane="profil" id="pf-pane-profil"><!-- injecté --></div>
        <div class="tabpane" data-pane="localisation" id="pf-pane-localisation"><!-- injecté --></div>
        <div class="tabpane" data-pane="sejour" id="pf-pane-sejour"><!-- injecté --></div>
        <div class="tabpane" data-pane="conformite" id="pf-pane-conformite"><!-- injecté --></div>
        <div class="tabpane" data-pane="roles" id="pf-pane-roles"><!-- injecté --></div>
        <div class="tabpane" data-pane="plateformes" id="pf-pane-plateformes"><!-- injecté --></div>

      </main>
    </div>
  </div>

  <!-- Modale : inviter un utilisateur -->
  <div class="modal" id="rl-modal" role="dialog" aria-modal="true" aria-labelledby="rl-modal-title">
    <div class="modal__head">
      <h3 class="modal__title" id="rl-modal-title">Inviter un utilisateur</h3>
      <button class="icon-btn" onclick="UI.closeAll()" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="field mb-4">
        <label class="field__label" for="rl-f-role">Rôle</label>
        <select class="select" id="rl-f-role"></select>
        <p class="text-xs text-muted mt-2" id="rl-f-roledesc"></p>
      </div>
      <div class="field mb-4" id="rl-f-lien-wrap" hidden>
        <label class="field__label" for="rl-f-lien">Fiche rattachée</label>
        <select class="select" id="rl-f-lien"></select>
        <p class="text-xs text-muted mt-2">Le compte ne verra que les données liées à cette fiche.</p>
      </div>
      <div class="app-grid app-grid--2">
        <div class="field"><label class="field__label" for="rl-f-nom">Nom complet</label><input class="input" id="rl-f-nom" placeholder="Prénom Nom" /></div>
        <div class="field"><label class="field__label" for="rl-f-email">Adresse e-mail</label><input class="input" type="email" id="rl-f-email" placeholder="nom@exemple.fr" /></div>
      </div>
      <p class="text-xs text-muted mt-4">Une invitation sera envoyée par e-mail. L’utilisateur choisira lui-même son mot de passe lors de sa première connexion.</p>
    </div>
    <div class="modal__foot">
      <button class="btn btn--secondary" onclick="UI.closeAll()">Annuler</button>
      <button class="btn btn--primary" id="rl-modal-confirm">Envoyer l’invitation</button>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/mp-data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/parametres.js"></script>
  <script src="../js/vivi.js"></script>
</body>
</html>
