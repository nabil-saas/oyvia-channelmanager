<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia interne — Vue d'ensemble</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Vue d'ensemble</h1>
            <p>L'état d'Oyvia au <span id="av-date"></span> : ce que nous facturons, ce qui bloque, ce qui attend une réponse.</p>
          </div>
        </div>

        <div class="app-grid app-grid--kpi mb-4" id="av-kpis"><!-- injecté --></div>

        <div class="app-grid app-grid--2-1 mb-4">
          <div class="card card--pad">
            <div class="row-between mb-2">
              <p class="eyebrow">Revenu mensuel récurrent</p>
              <span class="text-xs text-muted">12 derniers mois</span>
            </div>
            <div id="av-chart"><!-- injecté --></div>
          </div>
          <div class="card card--pad">
            <p class="eyebrow mb-4">D'où vient le revenu</p>
            <div id="av-mix"><!-- injecté --></div>
          </div>
        </div>

        <div class="app-grid app-grid--2">
          <div class="card card--pad">
            <p class="eyebrow mb-4">À traiter</p>
            <div id="av-todo"><!-- injecté --></div>
          </div>
          <div class="card card--pad">
            <div class="row-between mb-4">
              <p class="eyebrow">Derniers mouvements</p>
              <a class="btn btn--ghost btn--sm" href="equipe.html#journal">Tout le journal</a>
            </div>
            <div id="av-journal"><!-- injecté --></div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-vue.js"></script>
</body>
</html>
