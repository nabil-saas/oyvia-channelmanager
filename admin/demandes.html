<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oyvia interne — Demandes clients</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="app">
  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-body">
      <header class="app-topbar" id="app-topbar"></header>
      <main class="app-main">

        <div class="app-pagehead">
          <div>
            <h1>Demandes clients</h1>
            <p>Messages reçus via le bouton « Contacter le support » de l'application cliente et via WhatsApp Business.</p>
          </div>
        </div>

        <div class="app-grid app-grid--kpi mb-4" id="dm-kpis"><!-- injecté --></div>

        <div class="card card--pad">
          <div class="tabs mb-4" id="dm-tabs">
            <button class="is-active" data-onglet="a_traiter">À traiter</button>
            <button data-onglet="traitees">Traitées</button>
            <button data-onglet="toutes">Toutes</button>
          </div>

          <div class="adm-filtres">
            <input class="input" type="search" id="dm-q" placeholder="Société, message…" aria-label="Rechercher une demande" />
            <select class="select" id="dm-sujet" aria-label="Filtrer par sujet">
              <option value="tous">Tous les sujets</option>
            </select>
            <select class="select" id="dm-assignation" aria-label="Filtrer par assignation">
              <option value="tous">Toutes les assignations</option>
              <option value="non_assignees">Non assignées</option>
            </select>
            <span class="adm-compteur" id="dm-compteur"></span>
          </div>

          <div id="dm-liste"><!-- injecté --></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Panneau : traitement d'une demande -->
  <aside class="panel panel--lg" id="dm-panel" role="dialog" aria-modal="true" aria-labelledby="dm-panel-titre">
    <div class="panel__head">
      <div class="grow" id="dm-panel-tete">
        <h3 class="modal__title" id="dm-panel-titre">Demande</h3>
      </div>
      <button class="icon-btn" onclick="UI.closeAll()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel__body" id="dm-panel-corps"><!-- injecté --></div>
    <div class="panel__foot" id="dm-panel-pied"><!-- injecté --></div>
  </aside>

  <script src="../js/data.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-demandes.js"></script>
</body>
</html>
