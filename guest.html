<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Votre séjour — Oyvia</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/guest.css" />
</head>
<body class="g-body">
  <div class="g-shell" id="g-shell"><!-- injecté par guest.js --></div>

  <!-- Modale : fiche de police voyageur -->
  <div class="modal" id="fp-modal" role="dialog" aria-modal="true" aria-labelledby="fp-modal-title">
    <div class="modal__head">
      <h3 class="modal__title" id="fp-modal-title">Fiche de police</h3>
      <button class="icon-btn" id="fp-close" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modal__body">
      <div class="fp-form-grid">
        <div class="field"><label class="field__label" for="fp-civilite">Civilité</label>
          <select class="select" id="fp-civilite"><option value="M.">M.</option><option value="Mme">Mme</option></select></div>
        <div class="field"><label class="field__label" for="fp-nationalite">Nationalité *</label><input class="input" id="fp-nationalite" placeholder="Française" /></div>
        <div class="field"><label class="field__label" for="fp-nom">Nom *</label><input class="input" id="fp-nom" placeholder="Nom de famille" /></div>
        <div class="field"><label class="field__label" for="fp-prenom">Prénom *</label><input class="input" id="fp-prenom" placeholder="Prénom" /></div>
        <div class="field"><label class="field__label" for="fp-naissance">Date de naissance *</label><input class="input" type="date" id="fp-naissance" /></div>
        <div class="field"><label class="field__label" for="fp-lieu">Lieu de naissance</label><input class="input" id="fp-lieu" placeholder="Ville, pays" /></div>
        <div class="field"><label class="field__label" for="fp-type-piece">Type de pièce d'identité *</label>
          <select class="select" id="fp-type-piece">
            <option value="cni">Carte nationale d'identité</option>
            <option value="passeport">Passeport</option>
            <option value="titre_sejour">Titre de séjour</option>
          </select></div>
        <div class="field"><label class="field__label" for="fp-numero">Numéro de la pièce *</label><input class="input" id="fp-numero" placeholder="N° du document" /></div>
        <div class="field field--full"><label class="field__label" for="fp-adresse">Domicile habituel</label><input class="input" id="fp-adresse" placeholder="Adresse complète" /></div>
      </div>
      <!-- Le DOCUMENT d'identité, pas une photo d'identité : ce qu'on
           demande est la carte ou le passeport lui-même, pas le portrait
           qui s'y trouve. Le champ accepte l'appareil photo comme un
           fichier déjà enregistré — sur téléphone on photographie, sur
           ordinateur on joint un scan — parce que c'est le même
           document dans les deux cas. -->
      <div class="fp-pj">
        <div class="fp-pj__tete">
          <div>
            <b>Votre document d'identité</b>
            <small>Facultatif. Photographiez-le ou joignez un fichier : cela nous évite de vous recontacter si le numéro saisi est illisible. Recto et verso si nécessaire.</small>
          </div>
          <label class="btn btn--secondary btn--sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
            Ajouter
            <input type="file" id="fp-pj-input" accept="image/*,application/pdf" capture="environment" multiple hidden />
          </label>
        </div>
        <div class="fp-pj__liste" id="fp-pj-liste"><!-- injecté --></div>
      </div>

      <label class="fp-consent"><input type="checkbox" id="fp-consent" /> Je certifie l'exactitude des informations fournies et j'autorise leur conservation dans le cadre légal de l'accueil touristique.</label>
    </div>
    <div class="modal__foot">
      <button class="btn btn--secondary" id="fp-cancel">Annuler</button>
      <button class="btn btn--primary" id="fp-save">Enregistrer la fiche</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/guest.js"></script>
</body>
</html>
